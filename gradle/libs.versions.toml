[versions]
agp = "9.4.1"                  # AC 158 AARs need compileSdk 37.2 and Compose 1.12 needs AGP >= 9.1; AGP 9.4 needs Gradle >= 9.6
kotlin = "2.4.20"              # exactly what Android Components 158 was built with (stdlib pin in its POMs)
compose-bom = "2026.09.00"     # exactly AC 158's Compose BOM -> no skew with AC's compose-* artifacts
mozilla = "158.0"              # AC release train; transitively pins geckoview-omni 158.0.20261007201254
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
activity-compose = "1.13.0"
appcompat = "1.8.0"
material = "1.14.0"
lifecycle = "2.11.0"
core-ktx = "1.19.1"
junit-jupiter = "5.13.4"
biometric = "1.1.0"            # hatch:credentials — what Fenix 158 pins (gradle/libs.versions.toml: biometric = "1.1.0")
paparazzi = "2.0.0-alpha05.1"  # hatch:integrator — design-render screenshot tests only (AGP 9 + compileSdk 37 support, 2026-09-28)
work = "2.11.2"                # hatch:fixer — the version service-sync-logins 158.0 pulls at runtime scope (PERF-06)

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

# --- Mozilla Android Components (all same version) ---
mozilla-browser-engine-gecko = { module = "org.mozilla.components:browser-engine-gecko", version.ref = "mozilla" }
mozilla-concept-engine = { module = "org.mozilla.components:concept-engine", version.ref = "mozilla" }
mozilla-browser-state = { module = "org.mozilla.components:browser-state", version.ref = "mozilla" }
mozilla-lib-state = { module = "org.mozilla.components:lib-state", version.ref = "mozilla" }
mozilla-browser-session-storage = { module = "org.mozilla.components:browser-session-storage", version.ref = "mozilla" }
mozilla-feature-session = { module = "org.mozilla.components:feature-session", version.ref = "mozilla" }
mozilla-feature-tabs = { module = "org.mozilla.components:feature-tabs", version.ref = "mozilla" }
mozilla-feature-downloads = { module = "org.mozilla.components:feature-downloads", version.ref = "mozilla" }
mozilla-feature-prompts = { module = "org.mozilla.components:feature-prompts", version.ref = "mozilla" }
mozilla-feature-contextmenu = { module = "org.mozilla.components:feature-contextmenu", version.ref = "mozilla" }
mozilla-feature-sitepermissions = { module = "org.mozilla.components:feature-sitepermissions", version.ref = "mozilla" }
mozilla-feature-app-links = { module = "org.mozilla.components:feature-app-links", version.ref = "mozilla" }
mozilla-feature-intent = { module = "org.mozilla.components:feature-intent", version.ref = "mozilla" }
mozilla-browser-errorpages = { module = "org.mozilla.components:browser-errorpages", version.ref = "mozilla" }
mozilla-support-webextensions = { module = "org.mozilla.components:support-webextensions", version.ref = "mozilla" }
mozilla-support-base = { module = "org.mozilla.components:support-base", version.ref = "mozilla" }
mozilla-support-ktx = { module = "org.mozilla.components:support-ktx", version.ref = "mozilla" }
mozilla-support-utils = { module = "org.mozilla.components:support-utils", version.ref = "mozilla" }
# feature-intent only has feature-search at runtime scope; TabIntentProcessor needs SearchUseCases at compile time.
mozilla-feature-search = { module = "org.mozilla.components:feature-search", version.ref = "mozilla" }
# hatch:chrome begin — M1 browser chrome (compose toolbar, tab tray thumbnails/favicons, URL autocomplete).
# The 158.0 POMs put most transitive AC modules at runtime scope, so every module referenced from Kotlin is listed.
mozilla-compose-browser-toolbar = { module = "org.mozilla.components:compose-browser-toolbar", version.ref = "mozilla" }
mozilla-compose-base = { module = "org.mozilla.components:compose-base", version.ref = "mozilla" }
mozilla-ui-icons = { module = "org.mozilla.components:ui-icons", version.ref = "mozilla" }
mozilla-ui-tabcounter = { module = "org.mozilla.components:ui-tabcounter", version.ref = "mozilla" }
mozilla-concept-toolbar = { module = "org.mozilla.components:concept-toolbar", version.ref = "mozilla" }
mozilla-concept-base = { module = "org.mozilla.components:concept-base", version.ref = "mozilla" }
mozilla-browser-domains = { module = "org.mozilla.components:browser-domains", version.ref = "mozilla" }
mozilla-browser-thumbnails = { module = "org.mozilla.components:browser-thumbnails", version.ref = "mozilla" }
mozilla-browser-icons = { module = "org.mozilla.components:browser-icons", version.ref = "mozilla" }
# hatch:chrome end
# hatch:credentials begin — in-app logins store (Path 2) + WebAuthn delegate + device-credential gate.
# POMs verified 2026-10-18: service-sync-logins 158.0 -> appservices logins/sync15/db-crypto 158.0 (same
# app-services train feature-search already pulls), lib-dataprotect [compile], concept-storage [runtime],
# androidx.work 2.11.2 [runtime], glean 70.2.0 [runtime]; feature-webauthn 158.0 -> concept-engine only.
mozilla-service-sync-logins = { module = "org.mozilla.components:service-sync-logins", version.ref = "mozilla" }
mozilla-feature-webauthn = { module = "org.mozilla.components:feature-webauthn", version.ref = "mozilla" }
mozilla-concept-storage = { module = "org.mozilla.components:concept-storage", version.ref = "mozilla" }
mozilla-lib-dataprotect = { module = "org.mozilla.components:lib-dataprotect", version.ref = "mozilla" }
# hatch:fixer — the saved-login title is the registrable domain (DF-11). Already in the APK as support-ktx's runtime
# dependency (assets/publicsuffixes); declared so the app can compile against PublicSuffixList.
mozilla-lib-publicsuffixlist = { module = "org.mozilla.components:lib-publicsuffixlist", version.ref = "mozilla" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
# hatch:credentials end
# hatch:fixer begin — PERF-06: the manifest removes WorkManagerInitializer; HatchApplication is the Configuration.Provider
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
# hatch:fixer end

[bundles]
compose = ["compose-ui", "compose-ui-tooling-preview", "compose-foundation", "compose-material3", "compose-material-icons", "activity-compose", "lifecycle-runtime-compose", "lifecycle-viewmodel-compose"]
mozilla-core = [
  "mozilla-browser-engine-gecko", "mozilla-concept-engine", "mozilla-browser-state", "mozilla-lib-state",
  "mozilla-browser-session-storage", "mozilla-feature-session", "mozilla-feature-tabs", "mozilla-feature-downloads",
  "mozilla-feature-prompts", "mozilla-feature-contextmenu", "mozilla-feature-sitepermissions", "mozilla-feature-app-links",
  "mozilla-feature-intent", "mozilla-browser-errorpages", "mozilla-support-webextensions", "mozilla-support-base",
  "mozilla-support-ktx", "mozilla-support-utils", "mozilla-feature-search",
  # hatch:credentials begin
  "mozilla-service-sync-logins", "mozilla-feature-webauthn", "mozilla-concept-storage", "mozilla-lib-dataprotect",
  "mozilla-lib-publicsuffixlist",
  # hatch:credentials end
]
# hatch:chrome begin
mozilla-chrome = [
  "mozilla-compose-browser-toolbar", "mozilla-compose-base", "mozilla-ui-icons", "mozilla-ui-tabcounter",
  "mozilla-concept-toolbar", "mozilla-concept-base", "mozilla-browser-domains", "mozilla-browser-thumbnails",
  "mozilla-browser-icons",
]
# hatch:chrome end

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" } # hatch:integrator — test-only renders
