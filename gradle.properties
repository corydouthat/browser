# Sized for THIS build box: a 3.6 GB Vultr VPS that also runs prod containers.
# Gradle runs the Kotlin compiler in-process (no second daemon) and a single worker so the
# whole build stays under ~1.6 GB of heap. Raise these only on a bigger machine (NUC: -Xmx3g,
# drop the in-process strategy).
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
